name: hubpages_dev

services:
  hubpages-dev:
    image: hubpages-dev:${IMAGE_TAG:-develop}
    build:
      context: ..
      args:
        VITE_APP_ENV: development
        VITE_PUBLIC_URL: https://dev.hubpages.com.br
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - hubpages_dev_content:/data
    environment:
      HUBPAGES_ENV: development
      HUBPAGES_CUSTOM_DOMAINS_ENABLED: 'true'
      HUBPAGES_CUSTOM_DOMAIN_IPV4: 179.199.148.219
      HUBPAGES_CUSTOM_DOMAIN_TEST_HOST: teste.sistera.com.br
      HUBPAGES_CUSTOM_DOMAIN_ALLOWED_HOSTS: site.sistera.com.br
      HUBPAGES_STUDIO_UNIFIED_ENABLED: 'true'
      HUBPAGES_PLATFORM_ENABLED: 'true'
      HUBPAGES_CUSTOMER_SIGNUP_ENABLED: 'true'
      HUBPAGES_DEV_FREE_PUBLISH_ENABLED: 'true'
      HUBPAGES_DEV_PUBLIC_ORIGIN: https://dev.hubpages.com.br
      APP_ORIGINS: https://dev.hubpages.com.br,https://www.dev.hubpages.com.br
      HUBPAGES_ADMIN_EMAIL: ${HUBPAGES_ADMIN_EMAIL:-}
      HUBPAGES_BOOTSTRAP_TOKEN_HASH: ${HUBPAGES_BOOTSTRAP_TOKEN_HASH:-}
      HUBPAGES_SESSION_SECRET: ${HUBPAGES_SESSION_SECRET:-}
    cpus: 0.25
    mem_limit: 2g
    mem_reservation: 32m
    pids_limit: 100
    networks:
      hubpages_proxy:
        aliases:
          - hubpages-dev
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health.json').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

networks:
  hubpages_proxy:
    external: true
    name: sistera_vps_sistera_internal

volumes:
  hubpages_dev_content:
    name: hubpages_dev_content
