name: hubpages_dev

services:
  hubpages-dev:
    image: hubpages-dev:${IMAGE_TAG:-develop}
    build:
      context: ..
      args:
        VITE_APP_ENV: development
        VITE_PUBLIC_URL: https://dev.hubpages.com.br
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /config:size=8m,uid=10001,gid=10001,mode=0700
      - /data:size=8m,uid=10001,gid=10001,mode=0700
    cpus: 0.25
    mem_limit: 128m
    mem_reservation: 32m
    pids_limit: 100
    networks:
      hubpages_proxy:
        aliases:
          - hubpages-dev
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health.json"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

networks:
  hubpages_proxy:
    external: true
    name: sistera_vps_sistera_internal
